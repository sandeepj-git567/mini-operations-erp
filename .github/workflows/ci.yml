name: CI Pipeline (Build, Test & Security)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (TypeCheck, Database Tests & Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: mini_erp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Push Prisma Schema to Local CI Database
        run: |
          cd backend
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/mini_erp_db"

      - name: Seed Database
        run: |
          cd backend
          npm run seed
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/mini_erp_db"

      - name: TypeScript Type-Check (Backend)
        run: |
          cd backend
          npx tsc --noEmit

      - name: Run Backend Integration & Edge Case Tests
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/mini_erp_db"
          JWT_SECRET: "ci-pipeline-test-jwt-secret-minimum-32-chars"
          FRONTEND_URL: "http://localhost:3000"

      - name: Build Backend Production Bundle
        run: |
          cd backend
          npm run build

  frontend-ci:
    name: Frontend CI (TypeCheck & Next.js Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type-Check (Frontend)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Next.js Production App
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000"
          NEXT_PUBLIC_WS_URL: "ws://localhost:5000"

  docker-ci:
    name: Docker Containerization Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image (sandeepj07 Tagging Verification)
        run: |
          docker build -t sandeepj07/mini-operations-erp-backend:ci ./backend
